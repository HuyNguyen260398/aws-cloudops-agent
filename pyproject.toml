[project]
name = "cloudops-agent"
version = "0.2.0"
description = "Read-only AWS CloudOps agent on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "strands-agents==1.64.0",
    "bedrock-agentcore==1.26.0",
    "boto3==1.44.0",
    "aws-opentelemetry-distro==0.22.0",
]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_agent"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["legacy", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
